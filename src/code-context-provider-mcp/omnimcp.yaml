# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    absolutePath:
      type: string
      description: "Absolute path to the directory to analyze"
      minLength: 1
    analyzeJs:
      type: boolean
      description: "Whether to analyze JavaScript/TypeScript and Python files"
      default: false
    includeSymbols:
      type: boolean
      description: "Whether to include code symbols in the response"
      default: false
    symbolType:
      type: string
      description: "Type of symbols to include if includeSymbols is true"
      enum: ["functions", "variables", "classes", "imports", "exports", "all"]
      default: "all"
    filePatterns:
      type: array
      items:
        type: string
      description: "File patterns to analyze"
    maxDepth:
      type: integer
      description: "Maximum directory depth to analyze"
      default: 5
  required:
    - absolutePath
commandFunction:
  |-
  (config) => ({
    "command": "npx",
    "args": [
      "-y",
      "code-context-provider-mcp"
    ],
    "env": {
      // Include any specific environment variables if needed
    }
  })