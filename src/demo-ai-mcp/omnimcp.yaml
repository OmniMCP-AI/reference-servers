# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    figmaApiKey:
      type: string
      description: Figma API Access Token with read permissions
      minLength: 1
      required: true
    port:
      type: integer
      description: The port number on which the server will run
      minimum: 1
      maximum: 65535
      default: 3333
      required: false
commandFunction:
  # A function that produces the CLI command to start the MCP on stdio.
  |-
  (config) => ({
    "command": "pnpm",
    "args": [
      "run", "dev"
    ],
    "env": {
      "FIGMA_API_TOKEN": config.figmaApiKey,
      "PORT": config.port || 3333
    }
  })