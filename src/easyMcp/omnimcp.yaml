# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    MYSQL_HOST:
      type: string
      description: "MySQL Database Host"
      default: "192.168.3.229"
    MYSQL_PORT:
      type: integer
      description: "MySQL Database Port"
      default: 3306
    MYSQL_USER:
      type: string
      description: "MySQL Database User"
      default: "root"
    MYSQL_PASSWORD:
      type: string
      description: "MySQL Database Password"
      default: "root"
    MYSQL_DATABASE:
      type: string
      description: "MySQL Database Name"
      default: "a_llm"
    MYSQL_ROLE:
      type: string
      description: "MySQL Database Role"
      default: "admin"
  required: ["MYSQL_HOST", "MYSQL_PORT", "MYSQL_USER", "MYSQL_PASSWORD", "MYSQL_DATABASE", "MYSQL_ROLE"]
commandFunction:
  |-
  (config) => ({
    "command": "uv",
    "args": [
      "--directory",
      "G:\\python\\mysql_mcp\\src",
      "run",
      "server.py",
      "--stdio"
    ],
    "env": {
      "MYSQL_HOST": config.MYSQL_HOST,
      "MYSQL_PORT": config.MYSQL_PORT.toString(),
      "MYSQL_USER": config.MYSQL_USER,
      "MYSQL_PASSWORD": config.MYSQL_PASSWORD,
      "MYSQL_DATABASE": config.MYSQL_DATABASE,
      "MYSQL_ROLE": config.MYSQL_ROLE
    }
  })