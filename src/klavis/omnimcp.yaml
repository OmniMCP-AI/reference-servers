# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    apiKey:
      type: string
      description: "The API key used for authenticating requests."
      minLength: 1
    serverPort:
      type: integer
      description: "The port on which the server should run."
      minimum: 1
      maximum: 65535
    environment:
      type: string
      description: "The environment in which the server is running (e.g., development, production)."
      enum: ["development", "production"]
  required: ["apiKey", "serverPort"]
commandFunction:
  |-
  (config) => ({
    "command": "node",
    "args": [
      "dist/index.js",
      "--port",
      config.serverPort.toString()
    ],
    "env": {
      "API_KEY": config.apiKey,
      "NODE_ENV": config.environment
    }
  })