# omnimcp.ai configuration
build:
  dockerBuildPath: ../../

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      BEARER_TOKEN:
        type: string
        description: "Token de autenticação Bearer para segurança no header 'Authorization'."
        minLength: 1
      PORT:
        type: integer
        description: "Porta do servidor na qual o MCP Server escuta."
        minimum: 1
        maximum: 65535
    required: ["BEARER_TOKEN", "PORT"]
  commandFunction:
    |-
    (config) => ({
      "command": "node",
      "args": [
        "dist/index.js"
      ],
      "env": {
        "BEARER_TOKEN": config.BEARER_TOKEN,
        "PORT": config.PORT
      }
    })
