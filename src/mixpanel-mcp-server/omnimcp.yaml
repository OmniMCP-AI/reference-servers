# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    token:
      type: string
      description: Your Mixpanel project token
      minLength: 1
    debug:
      type: boolean
      description: Enable verbose logging
  required:
    - token
commandFunction:
  |-
  (config) => ({
    "command": "node",
    "args": [
      "index.js",
      "--token", config.token,
      ...(config.debug ? ["--debug"] : [])
    ],
    "env": {}
  })