# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    NEO4J_URI:
      type: string
      description: "The URI of the Neo4j server."
    NEO4J_USERNAME:
      type: string
      description: "The username for Neo4j authentication."
    NEO4J_PASSWORD:
      type: string
      description: "The password for Neo4j authentication."
    HTTP_PROXY:
      type: string
      description: "The HTTP proxy server address."
      default: null
    HTTPS_PROXY:
      type: string
      description: "The HTTPS proxy server address."
      default: null
  required:
    - NEO4J_URI
    - NEO4J_USERNAME
    - NEO4J_PASSWORD
commandFunction:
  |- 
  (config) => ({
    "command": "python",
    "args": [
      "src/server.py"
    ],
    "env": {
      "NEO4J_URI": config.NEO4J_URI,
      "NEO4J_USERNAME": config.NEO4J_USERNAME,
      "NEO4J_PASSWORD": config.NEO4J_PASSWORD,
      ...(config.HTTP_PROXY ? { "HTTP_PROXY": config.HTTP_PROXY } : {}),
      ...(config.HTTPS_PROXY ? { "HTTPS_PROXY": config.HTTPS_PROXY } : {})
    }
  })