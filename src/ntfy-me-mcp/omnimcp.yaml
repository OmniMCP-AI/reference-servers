# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    token:
      type: string
      description: "Secure token for authentication"
      required: true
commandFunction:
  # A function that produces the CLI command to start the MCP on stdio.
  |-
  (config) => ({
    "command": "node",
    "args": [
      "dist/index.js"
    ],
    "env": {
      "TOKEN": config.token
    }
  })