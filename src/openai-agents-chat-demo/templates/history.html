<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>对话历史 - OpenAI聊天助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .history-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }
        .history-header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conversation-card {
            margin-bottom: 15px;
            border-radius: 10px;
            transition: transform 0.2s;
        }
        .conversation-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .conversation-title {
            font-weight: 500;
        }
        .conversation-time {
            color: #6c757d;
            font-size: 0.85rem;
        }
        .empty-history {
            text-align: center;
            padding: 50px 0;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="history-container">
        <div class="history-header">
            <h2>对话历史</h2>
            <a href="/" class="btn btn-primary">返回聊天</a>
        </div>
        
        <div class="row" id="conversationList">
            {% if conversations %}
                {% for conversation in conversations %}
                <div class="col-md-6 col-lg-4">
                    <div class="card conversation-card">
                        <div class="card-body">
                            <h5 class="card-title conversation-title">{{ conversation.title }}</h5>
                            <p class="card-text conversation-time">{{ conversation.updated_at }}</p>
                            <a href="/?conversation_id={{ conversation.id }}" class="btn btn-sm btn-outline-primary">继续对话</a>
                            <button class="btn btn-sm btn-outline-danger delete-conversation" data-id="{{ conversation.id }}">删除</button>
                        </div>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty-history">
                    <h4>暂无对话历史</h4>
                    <p>开始一个新的对话吧！</p>
                    <a href="/" class="btn btn-primary">开始聊天</a>
                </div>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 处理删除对话
            const deleteButtons = document.querySelectorAll('.delete-conversation');
            deleteButtons.forEach(button => {
                button.addEventListener('click', async function() {
                    const conversationId = this.getAttribute('data-id');
                    if (confirm('确定要删除这个对话吗？此操作不可恢复。')) {
                        try {
                            const response = await fetch(`/delete-conversation/${conversationId}`, {
                                method: 'DELETE'
                            });
                            
                            if (response.ok) {
                                // 删除成功，移除对应的卡片
                                const card = this.closest('.col-md-6');
                                card.remove();
                                
                                // 检查是否还有对话
                                const remainingCards = document.querySelectorAll('.conversation-card');
                                if (remainingCards.length === 0) {
                                    // 如果没有对话了，显示空历史提示
                                    const conversationList = document.getElementById('conversationList');
                                    conversationList.innerHTML = `
                                        <div class="empty-history">
                                            <h4>暂无对话历史</h4>
                                            <p>开始一个新的对话吧！</p>
                                            <a href="/" class="btn btn-primary">开始聊天</a>
                                        </div>
                                    `;
                                }
                            } else {
                                alert('删除失败，请重试');
                            }
                        } catch (error) {
                            console.error('删除对话时出错:', error);
                            alert('删除失败，请重试');
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
