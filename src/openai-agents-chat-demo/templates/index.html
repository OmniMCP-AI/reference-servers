<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI聊天助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }
        .chat-header {
            background-color: #343a40;
            color: white;
            padding: 15px 20px;
            border-radius: 10px 10px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: white;
            border-left: 1px solid #dee2e6;
            border-right: 1px solid #dee2e6;
            min-height: 400px;
            max-height: calc(100vh - 250px);
        }
        .chat-input {
            background-color: #f8f9fa;
            padding: 15px 20px;
            border: 1px solid #dee2e6;
            border-radius: 0 0 10px 10px;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 75%;
            position: relative;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .assistant-message {
            background-color: #e9ecef;
            color: #212529;
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .message-time {
            font-size: 0.75rem;
            color: #6c757d;
            margin-top: 5px;
            text-align: right;
        }
        .typing-indicator {
            display: none;
            padding: 10px 15px;
            background-color: #e9ecef;
            border-radius: 18px;
            margin-bottom: 15px;
            width: fit-content;
        }
        .typing-indicator span {
            height: 10px;
            width: 10px;
            float: left;
            margin: 0 1px;
            background-color: #9E9EA1;
            display: block;
            border-radius: 50%;
            opacity: 0.4;
        }
        .typing-indicator span:nth-of-type(1) {
            animation: 1s blink infinite 0.3333s;
        }
        .typing-indicator span:nth-of-type(2) {
            animation: 1s blink infinite 0.6666s;
        }
        .typing-indicator span:nth-of-type(3) {
            animation: 1s blink infinite 0.9999s;
        }
        @keyframes blink {
            50% {
                opacity: 1;
            }
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0069d9;
            border-color: #0062cc;
        }
        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .markdown-content pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        .markdown-content code {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.875em;
            color: #212529;
            background-color: #f8f9fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }
        .markdown-content pre code {
            padding: 0;
            background-color: transparent;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>OpenAI聊天助手</h2>
            <div>
                <span id="username">{{ username }}</span>
                <button class="btn btn-sm btn-outline-light ms-2" id="clearChat">清空对话</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- 消息将在这里动态添加 -->
            <div class="message assistant-message">
                <div class="markdown-content">你好！我是基于OpenAI的聊天助手。有什么我可以帮助你的吗？</div>
                <div class="message-time">现在</div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <div class="chat-input">
            <form id="messageForm">
                <div class="input-group">
                    <textarea class="form-control" id="userInput" placeholder="输入你的问题..." rows="2"></textarea>
                    <button class="btn btn-primary" type="submit">发送</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 引入必要的JavaScript库 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messageForm = document.getElementById('messageForm');
            const userInput = document.getElementById('userInput');
            const chatMessages = document.getElementById('chatMessages');
            const typingIndicator = document.getElementById('typingIndicator');
            const clearChatButton = document.getElementById('clearChat');
            
            // 获取会话ID
            let conversationId = '{{ conversation_id }}';
            
            // 格式化时间
            function formatTime(date) {
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                return `${hours}:${minutes}`;
            }
            
            // 添加消息到聊天界面
            function addMessage(content, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
                
                const contentDiv = document.createElement('div');
                contentDiv.className = 'markdown-content';
                contentDiv.innerHTML = isUser ? content : marked.parse(content);
                
                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = formatTime(new Date());
                
                messageDiv.appendChild(contentDiv);
                messageDiv.appendChild(timeDiv);
                
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // 显示正在输入指示器
            function showTypingIndicator() {
                typingIndicator.style.display = 'block';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // 隐藏正在输入指示器
            function hideTypingIndicator() {
                typingIndicator.style.display = 'none';
            }
            
            // 发送消息到服务器
            async function sendMessage(message) {
                try {
                    showTypingIndicator();
                    
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            conversation_id: conversationId
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error('网络响应不正常');
                    }
                    
                    const data = await response.json();
                    hideTypingIndicator();
                    
                    // 更新会话ID
                    if (data.conversation_id) {
                        conversationId = data.conversation_id;
                    }
                    
                    // 添加助手回复
                    addMessage(data.response, false);
                    
                } catch (error) {
                    hideTypingIndicator();
                    console.error('发送消息时出错:', error);
                    addMessage('发送消息时出错: ' + error.message, false);
                }
            }
            
            // 处理表单提交
            messageForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const message = userInput.value.trim();
                if (!message) return;
                
                // 添加用户消息到界面
                addMessage(message, true);
                
                // 清空输入框
                userInput.value = '';
                
                // 发送消息到服务器
                sendMessage(message);
            });
            
            // 处理清空对话
            clearChatButton.addEventListener('click', function() {
                if (confirm('确定要清空当前对话吗？')) {
                    chatMessages.innerHTML = '';
                    // 添加初始欢迎消息
                    addMessage('你好！我是基于OpenAI的聊天助手。有什么我可以帮助你的吗？', false);
                    // 生成新的会话ID
                    conversationId = crypto.randomUUID();
                }
            });
            
            // 支持Ctrl+Enter发送消息
            userInput.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    messageForm.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
