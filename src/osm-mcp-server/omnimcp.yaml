# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    port:
      type: integer
      description: The port number on which the server will listen.
      default: 3000
    databaseUrl:
      type: string
      description: URL for the database connection.
      default: "postgresql://localhost:5432/osm"
    logLevel:
      type: string
      description: The logging level for the server.
      default: "info"
  required:
    - port
    - databaseUrl
commandFunction:
  |-
  (config) => ({
    "command": "npm",
    "args": [
      "start"
    ],
    "env": {
      "PORT": config.port,
      "DATABASE_URL": config.databaseUrl,
      "LOG_LEVEL": config.logLevel || "info"
    }
  })