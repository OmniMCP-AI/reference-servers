# omnimcp.ai configuration
build:
  dockerBuildPath: ./
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      oauthKVNamespace:
        type: string
        description: "KV namespace ID for OAuth sessions."
        required: true
  commandFunction: 
    |-
    (config) => ({
        "command": "npx",
        "args": [
          "nx",
          "dev",
          "remote-mcp-server"
        ],
        "env": {
          "OAUTH_KV_NAMESPACE": config.oauthKVNamespace
        }
    })