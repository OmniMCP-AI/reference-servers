# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    plugin:
      type: object
      properties:
        mcp:
          type: object
          properties:
            enabled:
              type: boolean
              description: Enable or disable the MCP
              default: true
              required: true
commandFunction:
  |-
  (config) => ({
    "command": "java",
    "args": [
      "-jar",
      "server2mcp-spring-boot-starter-0.0.1-SNAPSHOT.jar"
    ],
    "env": {
      "PLUGIN_MCP_ENABLED": config.plugin.mcp.enabled.toString()
    }
  })