# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    CWA_API_KEY:
      type: string
      description: "API 金鑰，用於中央氣象局 API 請求"
      minLength: 1
    MAX_RETRIES:
      type: integer
      description: "最大重試次數"
      default: 3
    TIMEOUT_MS:
      type: integer
      description: "API 請求超時（毫秒）"
      default: 10000
  required:
    - CWA_API_KEY
commandFunction:
  |-
  (config) => ({
    "command": "npx",
    "args": [
      "tsx",
      "src/server.ts"
    ],
    "env": {
      "CWA_API_KEY": config.CWA_API_KEY,
      "MAX_RETRIES": config.MAX_RETRIES.toString(),
      "TIMEOUT_MS": config.TIMEOUT_MS.toString(),
    }
  })