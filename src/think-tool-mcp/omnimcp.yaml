# omnimcp.ai configuration
startCommand:
  type: stdio
configSchema:
  type: object
  properties:
    command: 
      type: string
      description: "The command to execute."
      default: "node"
    args:
      type: array
      description: "The command line arguments."
      items:
        type: string
    env:
      type: object
      description: "Environment variables for the command."
  required: 
    - command
    - args
    
commandFunction:
  |-
  (config) => ({
    "command": config.command,
    "args": [
      "dist/index.js",
      ...(config.args || [])
    ],
    "env": {
      ...(config.env || {})
    }
  })